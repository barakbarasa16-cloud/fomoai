<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOMOAI Account</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">FOMO<i>AI</i></a></header><main class="section login"><div class="loginbox"><span class="eyebrow">ACCOUNT</span><h1 id="title">Login</h1><input id="name" placeholder="Name" style="display:none"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (8+ characters)"><select id="plan" style="display:none"><option value="normal">Normal — $50</option><option value="vip">VIP — $100</option></select><button class="btn primary" id="submit">Login</button><button class="btn ghost" id="toggle">Create account</button><p id="msg" class="muted"></p></div></main><script>let reg=false;const $=x=>document.querySelector(x);toggle.onclick=()=>{reg=!reg;title.textContent=reg?"Create account":"Login";submit.textContent=reg?"Register":"Login";name.style.display=reg?"block":"none";plan.style.display=reg?"block":"none";toggle.textContent=reg?"Back to login":"Create account"};submit.onclick=async()=>{try{const b={email:email.value,password:password.value};if(reg){b.name=name.value;b.plan=plan.value}const r=await fetch(reg?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error);localStorage.setItem("fomoToken",j.token);location.href=new URLSearchParams(location.search).get("next")||"/"}catch(e){msg.textContent=e.message}};</script></body></html>
