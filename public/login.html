<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FOMOAI Account</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a class="brand" href="/">FOMO<i>AI</i></a></header>
  <main class="section login">
    <div class="loginbox">
      <span class="eyebrow">ACCOUNT</span>
      <h1 id="title">Login</h1>

      <div id="loginView">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button class="btn primary" id="loginSubmit" type="button">Login</button>
        <button class="btn ghost" id="forgotBtn" type="button">Forgot password?</button>
        <button class="btn ghost" id="registerBtn" type="button">Create account</button>
      </div>

      <div id="registerView" style="display:none">
        <label for="name">Full name</label>
        <input id="name" placeholder="Your name" autocomplete="name">
        <label for="registerEmail">Email</label>
        <input id="registerEmail" type="email" placeholder="Email" autocomplete="email">
        <label for="registerPassword">Password</label>
        <input id="registerPassword" type="password" placeholder="Password (8+ characters)" autocomplete="new-password">
        <label for="plan">Membership plan</label>
        <select id="plan">
          <option value="normal">Normal — $50</option>
          <option value="vip">VIP — $100</option>
        </select>
        <button class="btn primary" id="registerSubmit" type="button">Register</button>
        <button class="btn ghost" id="backLoginBtn" type="button">Back to login</button>
      </div>

      <div id="forgotView" style="display:none">
        <p class="muted">Enter your registered email. We'll send you a 6-digit code.</p>
        <label for="forgotEmail">Email</label>
        <input id="forgotEmail" type="email" placeholder="Your registered email" autocomplete="email">
        <button class="btn primary" id="sendCodeBtn" type="button">Send reset code</button>
        <button class="btn ghost" id="forgotBackBtn" type="button">Back to login</button>
      </div>

      <div id="resetView" style="display:none">
        <p class="muted">Enter the 6-digit code sent to your email and choose a new password.</p>
        <label for="resetEmail">Email</label>
        <input id="resetEmail" type="email" placeholder="Your registered email" autocomplete="email">
        <label for="resetCode">Reset code</label>
        <input id="resetCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" placeholder="New password (8+ characters)" autocomplete="new-password">
        <button class="btn primary" id="resetBtn" type="button">Change password</button>
        <button class="btn ghost" id="resetBackBtn" type="button">Back to login</button>
      </div>

      <p id="msg" class="muted"></p>
    </div>
  </main>

  <script>
    const title=document.querySelector('#title'),msg=document.querySelector('#msg');
    const loginView=document.querySelector('#loginView'),registerView=document.querySelector('#registerView'),forgotView=document.querySelector('#forgotView'),resetView=document.querySelector('#resetView');
    const loginSubmit=document.querySelector('#loginSubmit'),registerSubmit=document.querySelector('#registerSubmit'),sendCodeBtn=document.querySelector('#sendCodeBtn'),resetBtn=document.querySelector('#resetBtn');
    function message(text,error=true){msg.textContent=text;msg.style.color=error?'#ff7887':'#58e6b1'}
    function view(name){loginView.style.display=name==='login'?'block':'none';registerView.style.display=name==='register'?'block':'none';forgotView.style.display=name==='forgot'?'block':'none';resetView.style.display=name==='reset'?'block':'none';title.textContent=name==='login'?'Login':name==='register'?'Create account':name==='forgot'?'Forgot password':'Reset password';msg.textContent=''}
    async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed. Please try again.');return d}
    document.querySelector('#registerBtn').onclick=()=>view('register');
    document.querySelector('#backLoginBtn').onclick=()=>view('login');
    document.querySelector('#forgotBtn').onclick=()=>view('forgot');
    document.querySelector('#forgotBackBtn').onclick=()=>view('login');
    document.querySelector('#resetBackBtn').onclick=()=>view('login');
    loginSubmit.onclick=async()=>{const email=document.querySelector('#loginEmail').value.trim(),password=document.querySelector('#loginPassword').value;if(!email||!email.includes('@'))return message('Enter a valid email address.');if(password.length<8)return message('Password must be at least 8 characters.');loginSubmit.disabled=true;loginSubmit.textContent='Logging in...';try{const d=await post('/api/login',{email,password});localStorage.setItem('fomoToken',d.token);window.location.href=new URLSearchParams(location.search).get('next')||'/'}catch(e){message(e.message);loginSubmit.disabled=false;loginSubmit.textContent='Login'}};
    registerSubmit.onclick=async()=>{const name=document.querySelector('#name').value.trim(),email=document.querySelector('#registerEmail').value.trim(),password=document.querySelector('#registerPassword').value,plan=document.querySelector('#plan').value;if(name.length<2)return message('Enter your name.');if(!email||!email.includes('@'))return message('Enter a valid email address.');if(password.length<8)return message('Password must be at least 8 characters.');registerSubmit.disabled=true;registerSubmit.textContent='Creating account...';try{const d=await post('/api/register',{name,email,password,plan});localStorage.setItem('fomoToken',d.token);message('Account created successfully.',false);setTimeout(()=>window.location.href=new URLSearchParams(location.search).get('next')||'/',500)}catch(e){message(e.message);registerSubmit.disabled=false;registerSubmit.textContent='Register'}};
    sendCodeBtn.onclick=async()=>{const email=document.querySelector('#forgotEmail').value.trim();if(!email||!email.includes('@'))return message('Enter a valid email address.');sendCodeBtn.disabled=true;sendCodeBtn.textContent='Sending...';try{await post('/api/forgot-password',{email});document.querySelector('#resetEmail').value=email;view('reset');message('If the account exists, a reset code has been sent to your email.',false)}catch(e){message(e.message);sendCodeBtn.disabled=false;sendCodeBtn.textContent='Send reset code'}};
    resetBtn.onclick=async()=>{const email=document.querySelector('#resetEmail').value.trim(),code=document.querySelector('#resetCode').value.trim(),password=document.querySelector('#newPassword').value;if(!/^[0-9]{6}$/.test(code))return message('Enter the 6-digit reset code.');if(password.length<8)return message('New password must be at least 8 characters.');resetBtn.disabled=true;resetBtn.textContent='Changing password...';try{await post('/api/reset-password',{email,code,password});message('Password changed successfully. You can now log in.',false);setTimeout(()=>view('login'),1200)}catch(e){message(e.message);resetBtn.disabled=false;resetBtn.textContent='Change password'}};
  </script>
</body>
</html>
