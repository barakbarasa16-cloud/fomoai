<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOMOAI Admin Panel</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">FOMO<i>AI</i></a><nav><a href="/">Public Site</a></nav><button class="btn ghost" id="logout">Logout</button></header><main class="section"><span class="eyebrow">PRIVATE CONTROL CENTER</span><h1>Admin Panel</h1><div id="msg" class="notice">Loading…</div><div class="adminstats" id="stats"></div><section><h2>Users & registrations</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Plan</th><th>Paid</th><th>Provider</th><th>Created</th></tr></thead><tbody id="users"></tbody></table></div></section><section><h2>Scanner settings</h2><div class="form"><label>Normal fee<input id="normal_fee"></label><label>VIP fee<input id="vip_fee"></label><label>FOMO threshold<input id="scanner_threshold"></label></div><button class="btn primary" style="margin-top:12px" id="save">Save settings</button></section></main><script>const t=localStorage.getItem("fomoAdminToken"),h={Authorization:"Bearer "+t,"Content-Type":"application/json"};async function load(){try{let r=await fetch("/api/admin/stats",{headers:h});if(!r.ok)throw Error("Admin login required");let s=await r.json();stats.innerHTML=[["Users",s.users],["VIP",s.vip],["Paid",s.paid],["Normal",s.normal]].map(x=>`<div class="card"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("");for(const k in s.settings)if(document.getElementById(k))document.getElementById(k).value=s.settings[k];r=await fetch("/api/admin/users",{headers:h});const u=await r.json();users.innerHTML=u.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.email}</td><td>${x.plan}</td><td>${x.paid?"Yes":"No"}</td><td>${x.provider||"—"}</td><td>${x.created_at}</td></tr>`).join("")}catch(e){msg.textContent=e.message}}load();save.onclick=async()=>{const r=await fetch("/api/admin/settings",{method:"POST",headers:h,body:JSON.stringify({normal_fee:normal_fee.value,vip_fee:vip_fee.value,scanner_threshold:scanner_threshold.value})});msg.textContent=r.ok?"Settings saved":"Save failed"};logout.onclick=()=>{localStorage.removeItem("fomoAdminToken");location.href="/admin-login.html"};</script></body></html>
