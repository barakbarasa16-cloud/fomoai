<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOMOAI Admin Login</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">FOMO<i>AI</i></a></header><main class="section login"><div class="loginbox"><span class="eyebrow">PRIVATE ADMIN</span><h1>Admin Login</h1><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button class="btn primary" id="go">Enter Admin Panel</button><p id="msg" class="muted"></p></div></main><script>go.onclick=async()=>{try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})}),j=await r.json();if(!r.ok)throw Error(j.error);localStorage.setItem("fomoAdminToken",j.token);location.href="/admin.html"}catch(e){msg.textContent=e.message}};</script></body></html>
