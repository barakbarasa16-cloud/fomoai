<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayPal Payment</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">FOMO<i>AI</i></a></header><main class="section login"><div class="loginbox"><span class="eyebrow">PAYPAL</span><h1 id="title">Verifying…</h1><p id="msg" class="muted">Please wait.</p><a id="back" class="btn primary" href="/" style="display:none">Back to FOMOAI</a></div></main><script>(async()=>{try{const id=new URLSearchParams(location.search).get("token"),t=localStorage.getItem("fomoToken");if(!id||!t)throw Error("Missing order or login session");const r=await fetch("/api/paypal/capture",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({orderId:id})}),j=await r.json();if(!r.ok)throw Error(j.error);title.textContent="Payment confirmed";msg.textContent="Your PayPal payment was verified.";back.style.display="inline-block"}catch(e){title.textContent="Verification failed";msg.textContent=e.message;back.style.display="inline-block"}})()</script></body></html>
