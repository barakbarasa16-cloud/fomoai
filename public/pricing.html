<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOMOAI Membership</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">FOMO<i>AI</i></a><nav><a href="/">Radar</a></nav><a class="admin" href="/login.html">Login</a></header><main class="section"><span class="eyebrow">MEMBERSHIP</span><h1>Choose your access</h1><p class="muted">Create an account first, then pay with Stripe or PayPal.</p><div class="plans"><div class="plan"><span class="eyebrow">NORMAL</span><h2>Normal</h2><div class="price">$50</div><p>Standard registration.</p><button class="btn primary" onclick="pay('normal','stripe')">Pay with Stripe</button><button class="btn paypal" onclick="pay('normal','paypal')">Pay with PayPal</button></div><div class="plan vip"><span class="eyebrow">VIP</span><h2>VIP</h2><div class="price">$100</div><p>VIP registration.</p><button class="btn primary" onclick="pay('vip','stripe')">Pay with Stripe</button><button class="btn paypal" onclick="pay('vip','paypal')">Pay with PayPal</button></div></div><div id="msg" class="notice" style="margin-top:18px">You must be logged in to pay.</div></main><script>async function pay(plan,p){const t=localStorage.getItem("fomoToken");if(!t){location.href="/login.html?next=/pricing.html";return}msg.textContent="Starting checkout…";try{const r=await fetch("/api/checkout/"+p,{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({plan})}),j=await r.json();if(!r.ok)throw Error(j.error);location.href=j.url}catch(e){msg.textContent=e.message}}</script></body></html>
