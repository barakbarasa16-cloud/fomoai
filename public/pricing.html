<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOMOAI Membership</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">FOMO<i>AI</i></a><nav><a href="/">Radar</a></nav><a class="admin" href="/login.html">Login</a></header><main class="section"><span class="eyebrow">MEMBERSHIP</span><h1>Choose your access</h1><p class="muted">Normal $50 • VIP $100. Choose PayPal, Stripe, Binance, crypto wallet, M-Pesa or bank transfer when available.</p><div class="plans"><div class="plan"><span class="eyebrow">NORMAL</span><h2>Normal</h2><div class="price" id="normalPrice">$50</div><p>Standard registration.</p><div id="normalMethods"></div></div><div class="plan vip"><span class="eyebrow">VIP</span><h2>VIP</h2><div class="price" id="vipPrice">$100</div><p>VIP registration.</p><div id="vipMethods"></div></div></div><div id="msg" class="notice" style="margin-top:18px">Loading payment methods…</div><div id="manualBox" class="notice" style="display:none;margin-top:18px"></div></main><script>let methods={};function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function button(label,plan,method){return `<button class="btn ${method==='paypal'?'paypal':'primary'}" style="margin:5px 0" onclick="pay('${plan}','${method}')">${label}</button>`}function render(plan,root){const names={stripe:'Pay with Stripe',paypal:'Pay with PayPal',binance:'Pay with Binance',crypto:'Pay with Crypto Wallet',mpesa:'Pay with M-Pesa',bank:'Pay by Bank Transfer'};root.innerHTML=Object.entries(methods).filter(([k,v])=>v.enabled).map(([k])=>button(names[k],plan,k)).join('')||'<p class="muted">No payment method is currently enabled.</p>'}async function load(){try{const r=await fetch('/api/payment-methods'),d=await r.json();methods=d.methods||{};normalPrice.textContent='$'+d.normalFee;vipPrice.textContent='$'+d.vipFee;render('normal',normalMethods);render('vip',vipMethods);msg.textContent='Select a payment method above.'}catch{msg.textContent='Payment methods are temporarily unavailable.'}}async function pay(plan,method){const t=localStorage.getItem('fomoToken');if(!t){location.href='/login.html?next=/pricing.html';return}if(method==='stripe'||method==='paypal'){msg.textContent='Starting '+method+' checkout…';try{const r=await fetch('/api/checkout/'+method,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({plan})}),j=await r.json();if(!r.ok)throw Error(j.error);location.href=j.url}catch(e){msg.textContent=e.message}return}const a=methods[method]||{};const labels={bank:'Bank transfer',binance:'Binance Pay',crypto:'Crypto wallet',mpesa:'M-Pesa'};let details='';if(method==='bank')details=`<b>Bank:</b> ${esc(a.bankName)}<br><b>Account name:</b> ${esc(a.accountName)}<br><b>Account number:</b> ${esc(a.accountNumber)}<br><b>Branch:</b> ${esc(a.branch)}${a.swift?'<br><b>SWIFT:</b> '+esc(a.swift):''}`;if(method==='binance')details=`<b>Binance Pay ID:</b> ${esc(a.payId)}${a.email?'<br><b>Email:</b> '+esc(a.email):''}`;if(method==='crypto')details=`<b>Network:</b> ${esc(a.network)}<br><b>Wallet address:</b><br><code>${esc(a.address)}</code>`;if(method==='mpesa')details=`<b>Phone:</b> ${esc(a.phone)}${a.paybill?'<br><b>PayBill:</b> '+esc(a.paybill):''}${a.till?'<br><b>Till:</b> '+esc(a.till):''}${a.accountReference?'<br><b>Account/reference:</b> '+esc(a.accountReference):''}`;manualBox.style.display='block';manualBox.innerHTML=`<h3>${labels[method]} — ${plan.toUpperCase()} $${plan==='vip'?dollars(100):dollars(50)}</h3><p>Send the exact amount using the details below, then enter your transaction/reference number. Membership activates after admin verification.</p><p>${details}</p><input id="payref" placeholder="Transaction/reference number"><br><button class="btn primary" style="margin-top:10px" onclick="submitManual('${plan}','${method}')">I have paid</button>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function dollars(x){return Number(x).toFixed(2)}async function submitManual(plan,method){const t=localStorage.getItem('fomoToken'),reference=document.getElementById('payref')?.value.trim();if(!reference){msg.textContent='Enter your transaction/reference number.';return}const r=await fetch('/api/manual-payment',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({plan,method,reference})}),j=await r.json();msg.textContent=r.ok?j.message:j.error;if(r.ok)manualBox.style.display='none'}load();</script></body></html>
